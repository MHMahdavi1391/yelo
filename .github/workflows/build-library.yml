name: Auto library

on:
  push:
    branches: [main]
    paths:
      - "music/**"
      - "picture/**"
      - "scripts/build-library.py"
      - ".github/workflows/build-library.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audio tag reader
        run: pip install mutagen
      - name: Build library.json from folders
        run: python scripts/build-library.py
      - name: Commit library.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add library.json picture/_embedded
          if git diff --cached --quiet; then
            echo "library.json unchanged"
          else
            git commit -m "chore: rebuild library.json from music and picture folders"
            git push
          fi
