<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta name="google-site-verification" content="eckEmKRcxO2-v0_uGxKgiAfYmNxzAT6_36wGXXYYWFs" />
    <title>YELO Music | Lumen Technologies Co.</title>
    <meta name="description" content="YELO Music — لیبل موسیقی Lumen Technologies Co. پخش و دانلود آثار هنرمندان مستقل.">
    <meta name="keywords" content="YELO, YELO Music, LTC, موسیقی, لیبل">
    <meta name="author" content="Lumen Technologies Co.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://mhmahdavi1391.github.io/yelo/">
    <meta property="og:type" content="website">
    <meta property="og:title" content="YELO Music">
    <meta property="og:description" content="لیبل موسیقی LTC برای هنرمندان مستقل.">
    <meta property="og:url" content="https://mhmahdavi1391.github.io/yelo/">
    <meta property="og:image" content="https://mhmahdavi1391.github.io/yelo/logo.jpg">
    <meta property="og:site_name" content="YELO Music">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="YELO Music">
    <meta name="twitter:image" content="https://mhmahdavi1391.github.io/yelo/logo.jpg">
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <link rel="apple-touch-icon" href="logo.jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
      .footer-social{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}
      .footer-social a{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.12);font-size:.82rem;font-weight:700;text-decoration:none}
    </style>
</head>
<body class="theme-light">
<div class="container" id="app">
    <header class="header">
        <div class="header-top">
            <div class="logo-wrapper">
                <img src="logo.jpg" alt="YELO Music" class="logo-img" loading="lazy">
            </div>
            <div class="search-wrapper">
                <div class="search-box">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="searchInput" class="search-input" placeholder="Search music or artist..." autocomplete="off">
                    <button id="clearSearch" class="clear-btn" style="display: none;"><i class="fas fa-times"></i></button>
                </div>
            </div>
            <button id="themeToggle" class="theme-btn" title="Toggle theme" type="button">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </header>
    <div class="tabs" id="tabsContainer">
        <button class="tab-btn active" data-tab="home" type="button">Home</button>
        <button class="tab-btn" data-tab="artists" type="button">Artists</button>
        <button class="tab-btn" data-tab="favorites" type="button">Favorites</button>
        <button class="tab-btn" data-tab="recent" type="button">Recent</button>
    </div>
    <section class="songs-section">
        <div id="songGrid" class="song-grid"></div>
        <div id="noResults" class="no-results" style="display: none;">
            <i class="fas fa-music"></i>
            <p>Nothing was found.</p>
        </div>
    </section>
    <footer class="footer">
        <div class="footer-content">
            <img src="logo.jpg" alt="YELO" class="footer-logo" loading="lazy">
            <span>A subdivision of Lumen Technologies Co. (LTC)</span>
        </div>
        <div class="footer-social">
            <a href="https://t.me/LTC_TM" target="_blank" rel="noopener noreferrer"><i class="fab fa-telegram"></i> @LTC_TM</a>
            <a href="https://t.me/ltc_3d" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-cube"></i> ltc_3d</a>
            <a href="https://www.instagram.com/ltc_official.co/" target="_blank" rel="noopener noreferrer"><i class="fab fa-instagram"></i> ltc_official.co</a>
        </div>
        <a href="https://lt-c.iddns.ir" class="back-link">
            <i class="fas fa-arrow-right"></i> back to LTC HUB
        </a>
    </footer>
</div>
<div class="mini-player" id="miniPlayer">
    <div class="mini-player-inner">
        <img src="" alt="cover" class="mini-cover" id="miniCover">
        <div class="mini-info" id="miniInfoClick">
            <div class="mini-title" id="miniTitle">-</div>
            <div class="mini-artist" id="miniArtist">-</div>
        </div>
        <div class="mini-progress">
            <span class="mini-time" id="miniCurrentTime">0:00</span>
            <div class="mini-progress-bar" id="miniProgressBar"><div class="mini-progress-fill" id="miniProgressFill"></div></div>
            <span class="mini-time" id="miniTotalTime">0:00</span>
        </div>
        <div class="mini-controls">
            <button class="mini-btn" id="miniShuffle" title="Shuffle" type="button"><i class="fas fa-random"></i></button>
            <button class="mini-btn" id="miniPrev" type="button"><i class="fas fa-step-backward"></i></button>
            <button class="mini-btn play-btn" id="miniPlay" type="button"><i class="fas fa-play"></i></button>
            <button class="mini-btn" id="miniNext" type="button"><i class="fas fa-step-forward"></i></button>
            <button class="mini-btn loop-btn" id="miniLoop" title="Loop" type="button"><i class="fas fa-repeat"></i></button>
        </div>
        <div class="mini-volume">
            <i class="fas fa-volume-up" id="volumeIcon"></i>
            <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="1">
        </div>
        <div class="mini-actions">
            <button class="mini-btn like-btn" id="miniLike" type="button"><i class="fas fa-heart"></i></button>
            <a href="#" id="miniDownload" class="mini-btn" download><i class="fas fa-download"></i></a>
            <button class="mini-btn" id="miniExpand" title="Open player" type="button"><i class="fas fa-expand"></i></button>
            <button class="mini-btn" id="miniDisplay" title="Display mode" type="button"><i class="fas fa-tv"></i></button>
        </div>
    </div>
</div>
<div class="full-player" id="fullPlayer">
    <div class="full-player-backdrop" id="fullPlayerBackdrop"></div>
    <div class="full-player-content">
        <button class="full-close" id="fullClose" type="button"><i class="fas fa-chevron-down"></i></button>
        <div class="full-cover-wrap"><img src="" alt="cover" class="full-cover" id="fullCover"></div>
        <div class="full-info">
            <h2 class="full-title" id="fullTitle">-</h2>
            <p class="full-artist" id="fullArtist">-</p>
        </div>
        <div class="full-progress">
            <span class="full-time" id="fullCurrentTime">0:00</span>
            <div class="full-progress-bar" id="fullProgressBar"><div class="full-progress-fill" id="fullProgressFill"></div></div>
            <span class="full-time" id="fullTotalTime">0:00</span>
        </div>
        <div class="full-controls">
            <button class="full-btn" id="fullShuffle" type="button"><i class="fas fa-random"></i></button>
            <button class="full-btn" id="fullPrev" type="button"><i class="fas fa-step-backward"></i></button>
            <button class="full-btn full-play" id="fullPlay" type="button"><i class="fas fa-play"></i></button>
            <button class="full-btn" id="fullNext" type="button"><i class="fas fa-step-forward"></i></button>
            <button class="full-btn" id="fullLoop" type="button"><i class="fas fa-repeat"></i></button>
        </div>
        <div class="full-actions">
            <button class="full-action-btn" id="fullLike" type="button"><i class="fas fa-heart"></i> Like</button>
            <a href="#" id="fullDownload" class="full-action-btn" download><i class="fas fa-download"></i> Download</a>
            <button class="full-action-btn" id="fullDisplay" type="button"><i class="fas fa-tv"></i> Display</button>
        </div>
        <div class="full-volume">
            <i class="fas fa-volume-down"></i>
            <input type="range" id="fullVolumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="1">
            <i class="fas fa-volume-up"></i>
        </div>
    </div>
</div>
<div class="display-mode" id="displayMode">
    <div class="display-bg" id="displayBg"></div>
    <div class="display-blur" id="displayBlur"></div>
    <div class="display-center">
        <img src="" alt="cover" class="display-cover" id="displayCover">
        <div class="display-meta" id="displayMeta">
            <div class="display-title" id="displayTitle">-</div>
            <div class="display-artist" id="displayArtist">-</div>
        </div>
    </div>
    <div class="display-controls" id="displayControls">
        <button class="display-btn" id="displayPrev" type="button"><i class="fas fa-step-backward"></i></button>
        <button class="display-btn display-play" id="displayPlay" type="button"><i class="fas fa-play"></i></button>
        <button class="display-btn" id="displayNext" type="button"><i class="fas fa-step-forward"></i></button>
        <button class="display-btn display-exit" id="displayExit" type="button"><i class="fas fa-times"></i></button>
    </div>
    <div class="display-hint" id="displayHint">Tap to show controls</div>
</div>
<script src="script.js"></script>
</body>
</html>
